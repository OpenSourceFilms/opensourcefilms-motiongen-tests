name: MotionGen published sample offline acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-acceptance.yml"
      - "tests/**"
      - "outputs/kimodo/**"
      - "*.sh"
      - "envs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public research snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install CPU-only NumPy test dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify public NPZ schema and shell syntax only
        run: python -B -m unittest discover -s tests -p 'test_motiongen_published_sample.py' -v
      - name: Test smoke launcher error reporting with fake binaries
        run: python -B -m unittest discover -s tests -p 'test_motiongen_launchers.py' -v
      - name: Check STMC share setting is disabled before fake launch
        run: python -B -m unittest discover -s tests -p 'test_stmc_share_guard.py' -v
